<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>yubin files</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #F6F1E7;
    --paper-raised: #EFE8D8;
    --ink: #262220;
    --ink-soft: #6B6255;
    --leather: #8B5E3C;
    --teal: #3F5D5B;
    --rule: #D9CFBB;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Source Serif 4", Georgia, serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 4rem 1.5rem 6rem;
  }

  header.masthead {
    margin-bottom: 2.5rem;
  }

  header.masthead h1 {
    font-size: 2rem;
    font-weight: 600;
    margin: 0 0 0.4rem;
    letter-spacing: 0.01em;
  }

  header.masthead p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 1rem;
    max-width: 46ch;
  }

  .rule {
    border: none;
    border-top: 2px solid var(--ink);
    margin: 1.5rem 0 0;
  }

  .search-row {
    margin: 2rem 0 2.5rem;
  }

  .search-row input {
    width: 100%;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.95rem;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--ink);
    padding: 0.6rem 0.1rem;
    color: var(--ink);
    outline: none;
  }

  .search-row input::placeholder {
    color: var(--ink-soft);
  }

  .search-row input:focus {
    border-bottom: 1px solid var(--leather);
  }

  .count-line {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-top: 0.5rem;
  }

  ul.file-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  li.file-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.2rem;
    padding: 1.15rem 0;
    border-bottom: 1px solid var(--rule);
  }

  li.file-card:first-child {
    border-top: 1px solid var(--rule);
  }

  .file-main {
    min-width: 0;
  }

  .file-name {
    font-size: 1.05rem;
    font-weight: 500;
    word-break: break-word;
    margin: 0 0 0.35rem;
  }

  .file-meta {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    color: var(--ink-soft);
    display: flex;
    gap: 1.1rem;
  }

  .download-btn {
    flex-shrink: 0;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    text-decoration: none;
    color: var(--ink);
    border: 1px solid var(--ink);
    padding: 0.5rem 0.9rem;
    white-space: nowrap;
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .download-btn:hover {
    background: var(--ink);
    color: var(--paper);
  }

  .empty-state, .loading-state {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.9rem;
    color: var(--ink-soft);
    padding: 2rem 0;
    border-top: 1px solid var(--rule);
  }

  footer {
    margin-top: 3.5rem;
    padding-top: 1.2rem;
    border-top: 1px solid var(--rule);
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.75rem;
    color: var(--ink-soft);
  }

  @media (max-width: 480px) {
    .wrap { padding: 2.5rem 1.1rem 4rem; }
    header.masthead h1 { font-size: 1.6rem; }
    li.file-card { flex-direction: column; align-items: flex-start; gap: 0.7rem; }
    .download-btn { align-self: flex-start; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="masthead">
      <h1>yubin files</h1>
      <p>텔레그램 방에 올라온 자료를 자동으로 모아둔 곳입니다. 설치나 로그인 없이 바로 내려받을 수 있습니다.</p>
      <hr class="rule" />
    </header>

    <div class="search-row">
      <input type="text" id="searchInput" placeholder="파일명으로 찾기" autocomplete="off" />
      <div class="count-line" id="countLine"></div>
    </div>

    <ul class="file-list" id="fileList">
      <li class="loading-state">목록을 불러오는 중...</li>
    </ul>

    <footer>
      마지막 동기화 이후 목록입니다. 새 자료는 자동으로 반영됩니다.
    </footer>
  </div>

  <script>
    const fileListEl = document.getElementById("fileList");
    const searchInput = document.getElementById("searchInput");
    const countLine = document.getElementById("countLine");

    let allFiles = [];

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + " KB";
      return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    }

    function formatDate(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      return new Intl.DateTimeFormat("ko-KR", {
        year: "numeric", month: "long", day: "numeric"
      }).format(d);
    }

    function render(files) {
      fileListEl.innerHTML = "";

      if (files.length === 0) {
        fileListEl.innerHTML = '<li class="empty-state">아직 등록된 자료가 없습니다.</li>';
        countLine.textContent = "";
        return;
      }

      countLine.textContent = `총 ${files.length}개 파일`;

      for (const f of files) {
        const li = document.createElement("li");
        li.className = "file-card";

        const main = document.createElement("div");
        main.className = "file-main";

        const name = document.createElement("p");
        name.className = "file-name";
        name.textContent = f.filename;

        const meta = document.createElement("div");
        meta.className = "file-meta";
        const dateSpan = document.createElement("span");
        dateSpan.textContent = formatDate(f.telegram_date);
        const sizeSpan = document.createElement("span");
        sizeSpan.textContent = formatSize(f.size_bytes);
        meta.appendChild(dateSpan);
        meta.appendChild(sizeSpan);

        main.appendChild(name);
        main.appendChild(meta);

        const btn = document.createElement("a");
        btn.className = "download-btn";
        btn.href = `files/${encodeURIComponent(f.stored_as)}`;
        btn.download = f.filename;
        btn.textContent = "다운로드";

        li.appendChild(main);
        li.appendChild(btn);
        fileListEl.appendChild(li);
      }
    }

    function applyFilter() {
      const q = searchInput.value.trim().toLowerCase();
      const filtered = q
        ? allFiles.filter(f => f.filename.toLowerCase().includes(q))
        : allFiles;
      render(filtered);
    }

    searchInput.addEventListener("input", applyFilter);

    fetch("manifest.json", { cache: "no-store" })
      .then(res => {
        if (!res.ok) throw new Error("manifest.json을 불러오지 못했습니다");
        return res.json();
      })
      .then(data => {
        allFiles = (data.files || []).slice().sort(
          (a, b) => new Date(b.telegram_date) - new Date(a.telegram_date)
        );
        render(allFiles);
      })
      .catch(err => {
        fileListEl.innerHTML = `<li class="empty-state">목록을 불러오지 못했습니다 (${err.message})</li>`;
      });
  </script>
</body>
</html>
