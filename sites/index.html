<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Unvul Files</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #F6F1E7;
    --paper-raised: #EFE8D8;
    --ink: #262220;
    --ink-soft: #6B6255;
    --leather: #8B5E3C;
    --teal: #3F5D5B;
    --rule: #D9CFBB;

    /* 과목 분류별 색상 (썸네일 테두리 + 필터 칩) */
    --cat-korean: #C79A2E;   /* 국어: 노랑 */
    --cat-math: #4C7A44;     /* 수학: 초록 */
    --cat-english: #D0602F; /* 영어: 주홍 */
    --cat-social: #7A5A9E;   /* 사회탐구: 보라 */
    --cat-science: #4B93B8;  /* 과학탐구: 하늘색 */
    --cat-other: #9C948A;    /* 기타: 회색 */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Source Serif 4", Georgia, serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 4rem 1.5rem 6rem;
  }

  header.masthead {
    margin-bottom: 2.5rem;
  }

  header.masthead h1 {
    font-size: 2rem;
    font-weight: 600;
    margin: 0 0 0.4rem;
    letter-spacing: 0.01em;
  }

  header.masthead p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 1rem;
    max-width: 52ch;
  }

  .rule {
    border: none;
    border-top: 2px solid var(--ink);
    margin: 1.5rem 0 0;
  }

  .search-row {
    margin: 2rem 0 2.5rem;
  }

  .search-row input {
    width: 100%;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.95rem;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--ink);
    padding: 0.6rem 0.1rem;
    color: var(--ink);
    outline: none;
  }

  .search-row input::placeholder {
    color: var(--ink-soft);
  }

  .search-row input:focus {
    border-bottom: 1px solid var(--leather);
  }

  .count-line {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-top: 0.5rem;
  }

  /* ---- 과목 카테고리 필터 칩 ---- */
  .filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 1rem;
  }

  .filter-pill { position: relative; }

  .filter-pill input {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    cursor: pointer;
  }

  .filter-pill label {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    padding: 0.4rem 0.8rem;
    border: 1.5px solid var(--rule);
    color: var(--ink-soft);
    background: var(--paper-raised);
    cursor: pointer;
    user-select: none;
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    white-space: nowrap;
  }

  .filter-pill .dot {
    width: 0.6rem;
    height: 0.6rem;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--cat-color, var(--ink-soft));
  }

  .filter-pill input:checked + label {
    background: var(--cat-color, var(--ink));
    border-color: var(--cat-color, var(--ink));
    color: var(--paper);
  }

  .filter-pill input:checked + label .dot {
    background: var(--paper);
  }

  .filter-pill input:focus-visible + label {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }

  .filter-pill[data-cat="korean"] { --cat-color: var(--cat-korean); }
  .filter-pill[data-cat="math"] { --cat-color: var(--cat-math); }
  .filter-pill[data-cat="english"] { --cat-color: var(--cat-english); }
  .filter-pill[data-cat="social"] { --cat-color: var(--cat-social); }
  .filter-pill[data-cat="science"] { --cat-color: var(--cat-science); }
  .filter-pill[data-cat="other"] { --cat-color: var(--cat-other); }

  ul.file-grid {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.6rem 1.4rem;
  }

  li.file-card {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--rule);
    background: var(--paper-raised);
  }

  .thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    background: #E4DBC6;
    overflow: hidden;
    border: 3px solid var(--rule);
    transition: box-shadow 0.4s ease, transform 0.4s ease, border-color 0.4s ease;
  }

  /* 과목별 테두리 색 + 은은하게 숨쉬는 글로우 애니메이션 */
  .thumb.cat-korean { border-color: var(--cat-korean); --glow: var(--cat-korean); }
  .thumb.cat-math { border-color: var(--cat-math); --glow: var(--cat-math); }
  .thumb.cat-english { border-color: var(--cat-english); --glow: var(--cat-english); }
  .thumb.cat-social { border-color: var(--cat-social); --glow: var(--cat-social); }
  .thumb.cat-science { border-color: var(--cat-science); --glow: var(--cat-science); }
  .thumb.cat-other { border-color: var(--cat-other); --glow: var(--cat-other); }

  .thumb[class*="cat-"] {
    animation: thumbGlow 3.6s ease-in-out infinite;
  }

  @keyframes thumbGlow {
    0%, 100% {
      box-shadow:
        0 0 0 0 color-mix(in srgb, var(--glow) 0%, transparent),
        inset 0 0 0 0 color-mix(in srgb, var(--glow) 0%, transparent);
    }
    50% {
      box-shadow:
        0 0 16px 1px color-mix(in srgb, var(--glow) 55%, transparent),
        0 0 0 4px color-mix(in srgb, var(--glow) 16%, transparent),
        inset 0 0 10px 0 color-mix(in srgb, var(--glow) 12%, transparent);
    }
  }

  li.file-card:hover .thumb {
    animation-play-state: paused;
    transform: translateY(-3px);
    box-shadow:
      0 0 20px 2px color-mix(in srgb, var(--glow, var(--rule)) 65%, transparent),
      0 0 0 4px color-mix(in srgb, var(--glow, var(--rule)) 22%, transparent);
  }

  @media (prefers-reduced-motion: reduce) {
    .thumb[class*="cat-"] { animation: none; }
  }

  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s ease;
  }

  li.file-card:hover .thumb img {
    transform: scale(1.045);
  }

  .thumb .thumb-fallback {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Source Serif 4", Georgia, serif;
    font-style: italic;
    font-size: 1.1rem;
    color: var(--ink-soft);
  }

  .year-badge {
    position: absolute;
    top: 0.6rem;
    right: 0.6rem;
    background: var(--teal);
    color: var(--paper);
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    padding: 0.22rem 0.5rem;
    letter-spacing: 0.02em;
  }

  .card-body {
    padding: 1rem 1.1rem 1.1rem;
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
    flex: 1;
  }

  .file-title {
    font-size: 1rem;
    font-weight: 600;
    margin: 0;
    line-height: 1.35;
    word-break: break-word;
  }

  .file-tags {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    color: var(--leather);
    margin: 0;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .file-tags .dot {
    width: 0.5rem;
    height: 0.5rem;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .file-name-sub {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.74rem;
    color: var(--ink-soft);
    word-break: break-word;
    margin: 0;
  }

  .file-meta {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.74rem;
    color: var(--ink-soft);
    display: flex;
    gap: 0.9rem;
    margin: 0;
  }

  .download-btn {
    margin-top: auto;
    text-align: center;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    color: var(--ink);
    border: none;
    background: transparent;
    border-top: 1px solid var(--rule);
    padding-top: 0.75rem;
    display: block;
    width: 100%;
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .download-btn::after {
    content: "다운로드 ↓";
  }

  .download-btn:hover {
    background: var(--ink);
    color: var(--paper);
  }

  .download-btn[data-state="loading"]::after { content: "받는 중..."; }
  .download-btn[data-state="error"]::after { content: "다시 시도"; }

  .empty-state, .loading-state {
    grid-column: 1 / -1;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.9rem;
    color: var(--ink-soft);
    padding: 2rem 0;
    border-top: 1px solid var(--rule);
  }

  footer {
    margin-top: 3.5rem;
    padding-top: 1.2rem;
    border-top: 1px solid var(--rule);
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.75rem;
    color: var(--ink-soft);
  }

  /* ---- 다운로드 완료 토스트 ---- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 1.5rem;
    transform: translate(-50%, 0.5rem);
    background: var(--ink);
    color: var(--paper);
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.82rem;
    padding: 0.75rem 1.2rem;
    max-width: calc(100% - 2rem);
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 100;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .toast.error {
    background: var(--cat-english);
  }

  @media (max-width: 860px) {
    ul.file-grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 560px) {
    .wrap { padding: 2.5rem 1.1rem 4rem; }
    header.masthead h1 { font-size: 1.6rem; }
    ul.file-grid { grid-template-columns: 1fr; }
    .filter-pill label { padding: 0.45rem 0.7rem; font-size: 0.74rem; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="masthead">
      <h1>Unvul Files</h1>
      <p>Made by Unvul® (It's CCL). 설치나 로그인 없이 바로 내려받을 수 있습니다.</p>
      <hr class="rule" />
    </header>

    <div class="search-row">
      <input type="text" id="searchInput" placeholder="제목, 강사, 과목, 파일명으로 찾기" autocomplete="off" />

      <div class="filter-row" id="filterRow">
        <span class="filter-pill" data-cat="korean">
          <input type="checkbox" id="filter-korean" value="korean" />
          <label for="filter-korean"><span class="dot"></span>국어</label>
        </span>
        <span class="filter-pill" data-cat="math">
          <input type="checkbox" id="filter-math" value="math" />
          <label for="filter-math"><span class="dot"></span>수학</label>
        </span>
        <span class="filter-pill" data-cat="english">
          <input type="checkbox" id="filter-english" value="english" />
          <label for="filter-english"><span class="dot"></span>영어</label>
        </span>
        <span class="filter-pill" data-cat="social">
          <input type="checkbox" id="filter-social" value="social" />
          <label for="filter-social"><span class="dot"></span>사탐</label>
        </span>
        <span class="filter-pill" data-cat="science">
          <input type="checkbox" id="filter-science" value="science" />
          <label for="filter-science"><span class="dot"></span>과탐</label>
        </span>
        <span class="filter-pill" data-cat="other">
          <input type="checkbox" id="filter-other" value="other" />
          <label for="filter-other"><span class="dot"></span>기타</label>
        </span>
      </div>

      <div class="count-line" id="countLine"></div>
    </div>

    <ul class="file-grid" id="fileList">
      <li class="loading-state">목록을 불러오는 중...</li>
    </ul>

    <footer>
      마지막 동기화 이후 목록입니다. 새 자료는 자동으로 반영됩니다.
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const fileListEl = document.getElementById("fileList");
    const searchInput = document.getElementById("searchInput");
    const countLine = document.getElementById("countLine");
    const filterRow = document.getElementById("filterRow");
    const toastEl = document.getElementById("toast");

    let allFiles = [];
    let toastTimer = null;

    // ---- 과목 -> 카테고리 분류 ----
    // 띄어쓰기 유무가 섞여 있을 수 있어서, 공백을 다 지운 뒤 비교한다.
    const stripSpace = (s) => (s || "").replace(/\s+/g, "");

    const SOCIAL_SUBJECTS = new Set([
      "세계지리", "생활과윤리", "사회문화", "윤리와사상", "동아시아사",
      "세계사", "경제", "정치와법", "한국지리", "통합사회", "사회탐구",
    ]);

    const SCIENCE_SUBJECTS = new Set([
      "지구과학", "지구과학1", "지구과학2",
      "생명과학", "생명과학1", "생명과학2",
      "물리학", "물리학1", "물리학2",
      "화학", "화학1", "화학2",
      "통합과학", "과학탐구",
    ]);

    function subjectCategory(subject) {
      const norm = stripSpace(subject);
      if (!norm) return "other";
      if (norm === "국어") return "korean";
      if (norm === "수학") return "math";
      if (norm === "영어") return "english";
      if (SOCIAL_SUBJECTS.has(norm)) return "social";
      if (SCIENCE_SUBJECTS.has(norm)) return "science";
      return "other";
    }

    // ---- subject 필드가 비어있거나 "기타"로 분류될 때, 파일명/제목에 섞인
    //      과목 키워드를 보고 한 번 더 추정한다 (예: "2024_수학_모의고사.pdf") ----
    function categoryFromKeywords(text) {
      const norm = stripSpace(text);
      if (!norm) return null;
      if (norm.includes("국어")) return "korean";
      if (norm.includes("수학")) return "math";
      if (norm.includes("영어")) return "english";
      if (norm.includes("사회탐구") || norm.includes("사탐")) return "social";
      for (const subj of SOCIAL_SUBJECTS) {
        if (subj !== "사회탐구" && norm.includes(subj)) return "social";
      }
      if (norm.includes("과학탐구") || norm.includes("과탐")) return "science";
      for (const subj of SCIENCE_SUBJECTS) {
        if (subj !== "과학탐구" && norm.includes(subj)) return "science";
      }
      return null;
    }

    function resolveCategory(f) {
      const bySubject = subjectCategory(f.subject);
      if (bySubject !== "other") return bySubject;
      const byKeyword = categoryFromKeywords([f.filename, f.title].filter(Boolean).join(" "));
      return byKeyword || "other";
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + " KB";
      return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    }

    function formatDate(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      return new Intl.DateTimeFormat("ko-KR", {
        year: "numeric", month: "long", day: "numeric"
      }).format(d);
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function showToast(message, isError = false) {
      toastEl.textContent = message;
      toastEl.classList.toggle("error", isError);
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 3200);
    }

    // fetch로 파일을 완전히 받은 뒤(=진짜 다운로드 완료 시점) 저장을 트리거하고
    // 감사 토스트를 띄운다. 실패하면 새 탭에서 직접 열기로 대체한다.
    async function handleDownload(btn, url, filename) {
      if (btn.dataset.state === "loading") return;
      btn.dataset.state = "loading";
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("응답 오류");
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(blobUrl), 4000);
        btn.dataset.state = "";
        showToast("unvul-files를 사용해주셔서 감사합니다");
      } catch (err) {
        btn.dataset.state = "error";
        showToast("다운로드에 실패했어요. 다시 시도해주세요.", true);
        window.open(url, "_blank");
        setTimeout(() => { btn.dataset.state = ""; }, 1500);
      }
    }

    function render(files) {
      fileListEl.innerHTML = "";

      if (files.length === 0) {
        fileListEl.innerHTML = '<li class="empty-state">조건에 맞는 자료가 없습니다.</li>';
        countLine.textContent = "";
        return;
      }

      countLine.textContent = `총 ${files.length}개 파일`;

      for (const f of files) {
        const li = document.createElement("li");
        li.className = "file-card";

        const displayTitle = f.title || f.filename;
        const category = resolveCategory(f);

        const tagParts = [];
        if (f.subject) tagParts.push(f.subject);
        if (f.instructor) tagParts.push(f.instructor);
        const tagLine = tagParts.join(" · ");

        const thumbHtml = f.thumbnail
          ? `<img src="${escapeHtml(f.thumbnail)}" alt="" loading="lazy" />`
          : `<div class="thumb-fallback">PDF</div>`;

        const yearBadge = f.year ? `<span class="year-badge">${escapeHtml(f.year)}</span>` : "";

        li.innerHTML = `
          <div class="thumb cat-${category}">
            ${thumbHtml}
            ${yearBadge}
          </div>
          <div class="card-body">
            <p class="file-title">${escapeHtml(displayTitle)}</p>
            ${tagLine ? `<p class="file-tags"><span class="dot" style="background: var(--cat-${category})"></span>${escapeHtml(tagLine)}</p>` : ""}
            <p class="file-name-sub">${escapeHtml(f.filename)}</p>
            <div class="file-meta">
              <span>${formatDate(f.telegram_date)}</span>
              <span>${formatSize(f.size_bytes)}</span>
            </div>
            <button type="button" class="download-btn" data-state=""></button>
          </div>
        `;

        const btn = li.querySelector(".download-btn");
        const downloadUrl = `files/${encodeURIComponent(f.stored_as)}`;
        btn.addEventListener("click", () => handleDownload(btn, downloadUrl, f.filename));

        fileListEl.appendChild(li);
      }
    }

    function getCheckedCategories() {
      return Array.from(filterRow.querySelectorAll("input[type=checkbox]:checked")).map(el => el.value);
    }

    function applyFilter() {
      const q = searchInput.value.trim().toLowerCase();
      const checkedCats = getCheckedCategories();

      const filtered = allFiles.filter(f => {
        if (checkedCats.length > 0 && !checkedCats.includes(resolveCategory(f))) {
          return false;
        }
        if (!q) return true;
        const haystack = [f.filename, f.title, f.instructor, f.subject, f.year]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();
        return haystack.includes(q);
      });

      render(filtered);
    }

    searchInput.addEventListener("input", applyFilter);
    filterRow.addEventListener("change", applyFilter);

    fetch("manifest.json", { cache: "no-store" })
      .then(res => {
        if (!res.ok) throw new Error("manifest.json을 불러오지 못했습니다");
        return res.json();
      })
      .then(data => {
        allFiles = (data.files || []).slice().sort(
          (a, b) => new Date(b.telegram_date) - new Date(a.telegram_date)
        );
        render(allFiles);
      })
      .catch(err => {
        fileListEl.innerHTML = `<li class="empty-state">목록을 불러오지 못했습니다 (${err.message})</li>`;
      });
  </script>
</body>
</html>
