name: Sync secrets to Vercel
#
# GitHub Secrets의 GEMINI_API_KEY를 Vercel 프로젝트 환경변수로 동기화한다.
# (GitHub Secrets와 Vercel 환경변수는 완전히 별개의 저장소라, api/ask.js가
# process.env.GEMINI_API_KEY를 읽으려면 Vercel 쪽에도 따로 등록돼있어야 함)
#
# 필요한 GitHub Secrets (이 저장소의 Settings > Secrets and variables > Actions):
#   GEMINI_API_KEY      - 기존에 등록해둔 그 값 그대로 사용
#   VERCEL_TOKEN        - Vercel 계정 설정 > Tokens 에서 새로 발급
#   VERCEL_ORG_ID       - Vercel 프로젝트 Settings > General 에서 확인 (Team ID)
#   VERCEL_PROJECT_ID   - Vercel 프로젝트 Settings > General 에서 확인
#   VERCEL_DEPLOY_HOOK_URL (선택) - Vercel 프로젝트 Settings > Git > Deploy Hooks 에서 생성.
#     없으면 환경변수만 갱신되고, 실제로 반영되려면 다음 배포까지 기다려야 함.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-secrets-to-vercel.yml'

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # if: 조건에서는 secrets 컨텍스트를 직접 쓸 수 없어서(Unrecognized named-value 에러),
      # 한 번 env로 감싸서 참조한다.
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - name: Update GEMINI_API_KEY on Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e
          # 기존 값이 있으면 지우고 (없어도 에러 무시) 새로 등록.
          # vercel CLI는 update가 아니라 add만 지원해서, rm -> add로 갱신한다.
          npx --yes vercel env rm GEMINI_API_KEY production --yes --token="$VERCEL_TOKEN" || true
          printf '%s' "$GEMINI_API_KEY" | npx --yes vercel env add GEMINI_API_KEY production --token="$VERCEL_TOKEN"

      - name: Trigger redeploy so the new env var takes effect
        if: ${{ env.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: curl -fsSL -X POST "$VERCEL_DEPLOY_HOOK_URL"
