name: Fix Release/Manifest 불일치 정리

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "실제로 적용 (체크 해제하면 미리보기만 하고 아무것도 바꾸지 않음)"
        type: boolean
        default: false

concurrency:
  # ★ 중요: 반드시 sync.yml의 concurrency.group과 똑같은 값을 넣으세요. ★
  # 텔레그램은 같은 세션에 두 프로세스가 동시에 붙으면 세션 자체를 폐기합니다
  # (AuthKeyDuplicatedError). sync.py의 실시간 리스너가 실행 중일 때 이
  # 워크플로가 동시에 시작되면 두 워크플로 다 세션이 죽어버립니다.
  # 같은 group을 쓰면 sync.yml의 실행이 끝날 때까지 이 워크플로가 자동으로
  # 대기했다가 실행됩니다 (cancel-in-progress: false 이므로 서로를 취소하지
  # 않고 순서대로 실행됨).
  group: telegram-sync   # TODO: sync.yml에 실제로 적혀있는 값으로 바꾸세요
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fix-release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install telethon pymupdf python-dotenv

      - name: fix_release.py 실행
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_PHONE: ${{ secrets.TELEGRAM_PHONE }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          GH_DISPATCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY_FIXES: ${{ github.event.inputs.apply }}
        run: python fix_release.py
