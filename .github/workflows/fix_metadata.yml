name: 과거 파일 메타데이터 백필 (일회성, 수동 실행)

on:
  workflow_dispatch: # Actions 탭에서 수동으로 눌러야만 실행됨. 스케줄 없음.

permissions:
  contents: write

concurrency:
  # sync.yml과 같은 그룹으로 묶어서, sync.py가 지금 돌고 있으면(같은
  # TELEGRAM_SESSION을 씀) 그게 끝날 때까지 자동으로 대기시킨다.
  # 동시에 붙으면 텔레그램이 AuthKeyDuplicatedError로 세션을 파기하기 때문에
  # 이 설정이 없으면 안 된다.
  group: sync-telegram-pdfs
  cancel-in-progress: false

jobs:
  fix_metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: fix_metadata.py 실행
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python fix_metadata.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sites/manifest.json
          git diff --staged --quiet || git commit -m "chore: 과거 파일 메타데이터 백필 [skip ci]"
          git push
